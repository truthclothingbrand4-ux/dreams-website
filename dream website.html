    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }
        #intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #fff;
            font-size: 2em;
        }
        #intro button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.5em;
            cursor: pointer;
            border-radius: 10px;
            animation: bounce 2s infinite ease-in-out;
        }
        #intro button:hover {
            background-color: #0056b3;
        }
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            25% {
                transform: translateY(-12px);
            }
            50% {
                transform: translateY(0);
            }
            75% {
                transform: translateY(-6px);
            }
        }
        .content {
            display: none;
        }
        .header-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 40px;
        }
        .header {
            font-size: 3em;
            color: #fff;
            margin: 0;
        }
        .header-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: none;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.25);
        }
        .spotify-card {
            display: inline-flex;
            align-items: center;
            gap: 18px;
            background: rgba(12, 12, 12, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            border-radius: 24px;
            padding: 18px 26px;
            backdrop-filter: blur(14px);
            margin: 20px auto 30px;
            max-width: 780px;
            position: relative;
            overflow: hidden;
        }
        .spotify-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #ffffff;
            animation: progressBar 180s linear infinite;
        }
        @keyframes progressBar {
            0% {
                transform: scaleX(0);
                transform-origin: left;
            }
            100% {
                transform: scaleX(1);
                transform-origin: left;
            }
        }
        .spotify-cover {
            width: 108px;
            height: 108px;
            border-radius: 20px;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        }
        .spotify-info {
            text-align: left;
            color: #fff;
            display: grid;
            gap: 6px;
        }
        .spotify-top {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
            color: #b3b3b3;
            text-transform: uppercase;
            letter-spacing: 0.16em;
        }
        .spotify-icon {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #1db954;
            color: #000;
            position: relative;
            z-index: 1;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(29, 185, 84, 0.3);
        }
        .spotify-info h2 {
            font-size: 1.6em;
            margin: 0;
            letter-spacing: 0.02em;
        }
        .spotify-info p {
            margin: 0;
            color: #b3b3b3;
            font-size: 0.95em;
        }
        .spotify-badge {
            font-size: 0.75em;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #1db954;
            margin-top: 10px;
        }
        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .subtitle {
            font-size: 1.5em;
            margin-bottom: 30px;
            color: #ccc;
        }
        button {
            background: linear-gradient(135deg, #ffffff, #000000);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1em;
            cursor: pointer;
            margin: 10px;
            border-radius: 5px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 38px rgba(0, 0, 0, 0.35);
            opacity: 0.95;
        }
        button a {
            color: #000;
            text-decoration: none;
        }
        .banner {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            border-radius: 10px;
        }
        .profile {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 20px;
            border: 2px solid #fff;
        }
        .past-work {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin: 40px 0;
        }
        .project {
            margin: 20px;
            text-align: center;
            color: #fff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .project:hover {
            transform: scale(1.05);
        }
        .project img {
            width: 520px;
            max-width: 100%;
            height: auto;
            border-radius: 18px;
            margin-bottom: 10px;

            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: zoom-in;
        }
        .project p {

        }
        .links {

        }
        .links ul {
            list-style: none;
            padding: 0;
        }
        .links li {
            display: inline;
            margin: 0 15px;
        }
        .links a {
            text-decoration: none;
            color: #007bff;
        }
    </style>
